name: 策略独立计算与推荐

on:
  workflow_dispatch:
    inputs:
      strategy_id:
        description: '策略ID (如 pe_strategy, cb_double_low)'
        required: true
        type: string
        default: 'pe_strategy'
      target_date:
        description: '行情目标日 (YYYY-MM-DD)'
        required: true
        type: string
      force:
        description: '是否强制重新计算'
        required: false
        type: boolean
        default: false

  repository_dispatch:
    types:
      - run-strategy

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 执行策略推荐计算
        env:
          DB_HOST: ${{ secrets.TIDB_HOST }}
          DB_PORT: ${{ secrets.TIDB_PORT }}
          DB_USER: ${{ secrets.TIDB_USER }}
          DB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          DB_NAME: ${{ secrets.TIDB_DB_NAME }}
          DB_SSL_CA: ${{ secrets.TIDB_SSL_CA }}
        run: |
          STG_ID="${{ inputs.strategy_id || github.event.client_payload.strategy_id }}"
          TARGET_DT="${{ inputs.target_date || github.event.client_payload.target_date }}"
          FORCE_FLAG="${{ inputs.force || github.event.client_payload.force }}"
          
          CMD="python -m MagicSTG.strategies.runner --strategy $STG_ID --date $TARGET_DT"
          if [ "$FORCE_FLAG" = "true" ]; then
            CMD="$CMD --force"
          fi
          echo "执行命令: $CMD"
          $CMD
